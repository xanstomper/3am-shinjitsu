name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run offline verification suite
        run: python3 scripts/verify_3am.py --only compile,templates-json,matrix-sync,cli-subcommands,art-clean,gate-language,sections